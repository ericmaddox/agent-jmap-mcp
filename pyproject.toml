[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-jmap-mcp"
version = "0.1.0"
description = "Modern, stateless JMAP email client and Model Context Protocol (MCP) server for AI agents."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Eric Maddox", email = "eric.maddox@outlook.com" }
]
keywords = [
    "mcp",
    "mcp-server",
    "jmap",
    "email",
    "fastmail",
    "ai-agents",
    "claude",
    "hermes-agent",
    "cursor",
    "model-context-protocol"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.0,<1.0.0",
    "mcp>=1.3.0,<2.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "rich>=13.9.0,<14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
agent-jmap-mcp = "agent_jmap_mcp.server:main"
agent-jmap = "agent_jmap_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/ericmaddox/agent-jmap-mcp"
Repository = "https://github.com/ericmaddox/agent-jmap-mcp.git"
Issues = "https://github.com/ericmaddox/agent-jmap-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_jmap_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
